max_iterations: 50
checkpoint_interval: 5
llm:
  primary_model: Qwen3-8B
  primary_model_weight: 1
  api_base: http://127.0.0.1:8080/v1
  api_key: code-efficiency
  temperature: 0.7
  max_tokens: 16000
  timeout: 120
prompt:
  system_message: "\"You are an expert competitive programmer specializing in advanced\
    \ algorithm design and implementation, with strong focus on correctness, time\
    \ efficiency, and memory efficiency.\n\nPlease carefully read the task description\
    \ (a standard input/output competitive programming problem) and write a **Python\
    \ solution** that:\n1. Reads from **stdin** (`sys.stdin` or `input()`).\n2. Writes\
    \ the correct output to **stdout** (`print()`).\n3. Has no hard-coded test cases\
    \ or extra print statements.\n4. Runs efficiently within typical contest constraints.\n\
    \nYou must follow these additional rules:\n- The code must be enclosed in a single\
    \ block: \n  ```python\n  [Code]\n````\n\n* Do **not** include provided test cases\
    \ inside the code block.\n* Do **not** generate your own test cases; assume the\
    \ system will provide them via stdin.\n* Ensure the solution passes the official\
    \ test cases.\n\nIMPORTANT:\n\n* This is an **evolution setting**. Do not rewrite\
    \ the entire program from scratch.\n* Focus only on targeted improvements, and\
    \ wrap them with `EVOLVE-BLOCK-START` / `EVOLVE-BLOCK-END`.\n* All changes must\
    \ be expressed in the `<<<<<<< SEARCH`, `=======`, `>>>>>>> REPLACE` diff format.\n\
    \n# Task description:\n\nProblem Statement\nFind the number of positive integers\
    \ not greater than\nN\nthat have exactly\n9\npositive divisors.\nConstraints\n\
    1 \\leq N \\leq 4 \\times 10^{12}\nAll input values are integers.\nInput\nThe\
    \ input is given from Standard Input in the following format:\nN\nOutput\nPrint\
    \ the answer.\nSample Input 1\n200\nSample Output 1\n3\nThree positive integers\n\
    36,100,196\nsatisfy the condition.\nSample Input 2\n4000000000000\nSample Output\
    \ 2\n407073\"\n"
  template_dir: /data/CodeEfficiency/openevolve/openevolve/prompts/defaults
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  log_prompts: true
evaluator:
  timeout: 300
  enable_artifacts: true
  cascade_evaluation: false 
  parallel_evaluations: 2
diff_based_evolution: true
max_code_length: 20000
