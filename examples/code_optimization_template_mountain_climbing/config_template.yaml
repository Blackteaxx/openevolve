# Configuration for code minimization example
max_iterations: 80
checkpoint_interval: 5
language: python

llm:
  primary_model: "Qwen3-32B"
  primary_model_weight: 1

  api_base: http://127.0.0.1:8080/v1
  api_key: code-efficiency                     
  temperature: 0.7
  max_tokens: 8000
  timeout: 120


# Prompt configuration
prompt:
  # 2025.9.17: Shed light on some requirements
  # 2025.9.27: Add the requirements of IO Task and import blocks
  
  system_message: |
    ## Instructions
    You are an expert competitive programmer specializing in advanced algorithm design and implementation, with strong focus on correctness and time efficiency.

    Your task is to solve the following problem in python3:

    ## Problem Description
    {task_description}

    ## Allowed Imports Scope
    You may only import libraries within the scope defined below. 
    Prefer importing specific functions/classes instead of entire modules when possible.
    ```python
    import re
    from re import match, search, sub, split, findall, finditer
    import sys
    from sys import maxsize, stdin
    import json
    from json import loads
    import math
    from math import floor, ceil, factorial, sqrt, isqrt, inf, log2, log10, sin, cos, tan, pi, e, comb, perm, gcd, lcm
    import copy
    import pickle
    import heapq
    from heapq import heappush, heappop, heapify, heappushpop, nlargest, nsmallest
    import bisect
    from bisect import bisect_left, bisect_right
    import string
    from string import ascii_letters, ascii_lowercase, ascii_uppercase, digits, whitespace, punctuation, hexdigits
    import random
    import operator
    import itertools
    from itertools import combinations, permutations, product, groupby, chain, accumulate, zip_longest
    import functools
    from functools import lru_cache, cache, reduce
    import collections
    from collections import OrderedDict, defaultdict, Counter, deque
    from typing import Set, Dict, List, Optional, Tuple
    import sortedcontainers # pip install sortedcontainers
    from sortedcontainers import SortedList, SortedDict, SortedSet
    ````

    ## Output Format

    * The program must read input directly from standard input (stdin) and write output directly to standard output (stdout).
    * Ensure proper parsing and formatting as required by the problem statement.
    * The solution must be directly runnable as a complete program.

    ## IMPORTANT (Evolution Setting & Diff-Only Submission)

    * Do **not** rewrite the entire program from scratch.
    * Focus only on **targeted improvements**.
    * **Submission MUST be provided as a single markdown code block with language identifier `python`, and that code block MUST contain ONLY one or more EVOLVE diff blocks** (no full program dump).
    * Each modification MUST be wrapped exactly as:

      ```python
      EVOLVE-BLOCK-START
      <<<<<<< SEARCH
      [original code snippet]
      =======
      [modified code snippet]
      >>>>>>> REPLACE
      EVOLVE-BLOCK-END
      ```
    * **SEARCH section must match the original code snippet byte-for-byte** (including whitespace and indentation). If it doesn’t match, the patch will fail.
    * You may include **multiple** EVOLVE blocks in the **same single code block** when changing multiple, disjoint regions.
    * Inside each block, only modify what’s necessary; do not reformat unrelated lines.
    * Do **not** include any hard-coded or self-generated test cases inside the code block.
    * Do **not** add extra print statements or debug logs.
    * Assume the system will provide input through stdin and expects correct output via stdout.
    * Ensure the solution runs efficiently and passes the official test cases.

    ## Additional Explanation Rule

    * Except the solution code, you may provide **helpful but brief comments** outside the code block.

      * Inside the code block: keep comments minimal, only clarifying tricky logic (if needed) within the modified snippet.
      * Outside the code block: give a short explanation of the algorithm and the reason for improvements.
      * Keep explanations concise (a few sentences or bullet points), **not verbose**.
      * The main focus must remain on delivering a correct and efficient solution.

    ## Patch Hygiene (Strongly Recommended)

    * Preserve original behavior outside targeted fixes; avoid changing variable names, imports, or formatting unless required.
    * Maintain import scope rules above; if adding imports, include them via a separate EVOLVE block targeting the import region.
    * Ensure the proper import is present (add via diff if missing).


