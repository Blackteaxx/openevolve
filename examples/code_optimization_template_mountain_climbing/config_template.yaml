  # 2025.9.17: Add Template Dir
  template_dir: "/data/CodeEfficiency/openevolve/openevolve/prompts/defaults"

  # 2025.9.26: Add num_top_programs and num_diverse_programs
  num_top_programs: 0
  num_diverse_programs: 0
  include_artifacts: true

# Database configuration
database:
  population_size: 100
  archive_size: 20
  num_islands: 1
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  log_prompts: true # Enable logging of prompts for debugging

  # If true, sampling from island picks the best-fitness parent deterministically
  island_pick_best_parent: true

# Evaluator configuration
evaluator:
  timeout: 2000
  enable_artifacts: true      # Error feedback to LLM
  cascade_evaluation: true
  cascade_thresholds: [0.6]   # Set as the weight of pass rate to decide if the solution passes the cascade evaluation
  parallel_evaluations: 1

# Evolution settings
diff_based_evolution: true
max_code_length: 20000