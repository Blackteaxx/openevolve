# Configuration for function minimization example
max_iterations: 50
checkpoint_interval: 5
use_explanation: true 

llm:
  primary_model: "Qwen3-32B"
  primary_model_weight: 1

  api_base: http://127.0.0.1:8080/v1
  api_key: code-efficiency                     
  temperature: 0.7
  max_tokens: 8000
  timeout: 120


# Explanation configuration (dedicated LLM ensemble)
explanation:
  enabled: true
  template_key: "explanation"
  system_message_key: "system_message"
  include_code: true
  max_artifacts_bytes: 1024
  # Choose which role to base defaults on when no dedicated LLM provided
  # Options: "evolution" or "evaluator"
  ensemble_role: "evolution"
  # Dedicated LLM configuration for explanations
  llm:
    primary_model: "Qwen3-32B"
    primary_model_weight: 1

    api_base: http://127.0.0.1:8080/v1
    api_key: code-efficiency                     
    temperature: 0.7
    max_tokens: 8000
    timeout: 120

# Experience Knowledge Base (KB) configuration
experience_kb:
  enabled: true            # Enable KB updates and storage
  include_in_prompt: true  # Inject KB summary into evolution prompts
  record_failures: false  # Record negative learnings when score drops
  
  llm:
    primary_model: "deepseek-v3"
    primary_model_weight: 1

    api_base: http://publicshare.a.pinggy.link/v1
    api_key: token-abc123                   
    temperature: 0.7
    max_tokens: 8000
    timeout: 120

# Prompt configuration
prompt:
  system_message: "You are an expert programmer specializing in optimization algorithms. Your task is to improve a function minimization algorithm to find the global minimum of a complex function with many local minima. The function is f(x, y) = sin(x) * cos(y) + sin(x*y) + (x^2 + y^2)/20. Focus on improving the search_algorithm function to reliably find the global minimum, escaping local minima that might trap simple algorithms."

# Database configuration
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  log_prompts: true # Enable logging of prompts for debugging

# Evaluator configuration
evaluator:
  timeout: 60
  cascade_thresholds: [1.3]
  parallel_evaluations: 3



# Evolution settings
diff_based_evolution: true
max_code_length: 20000