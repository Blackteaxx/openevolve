# Configuration for function minimization example
max_iterations: 200
checkpoint_interval: 5

# LLM configuration
# 2025.9.17: Adapt local model
llm:
  primary_model: "Qwen3-8B"
  primary_model_weight: 1

  # secondary_model: "qwen2.5-coder-7B-Instruct"
  # secondary_model_weight: 0.4

  api_base: http://127.0.0.1:8080/v1
  api_key: code-efficiency                     
  temperature: 0.7
  max_tokens: 16000
  timeout: 120

# Prompt configuration
prompt:
  # 2025.9.17: Shed light on some requirements
  # system_message: "You are an expert programmer specializing in optimization algorithms. Your task is to improve a function minimization algorithm to find the global minimum of a complex function with many local minima. The function is f(x, y) = sin(x) * cos(y) + sin(x*y) + (x^2 + y^2)/20. Focus on improving the search_algorithm function to reliably find the global minimum, escaping local minima that might trap simple algorithms."
  system_message: "You are an expert programmer specializing in optimization algorithms. Your task is to improve a function minimization algorithm to find the global minimum of a complex function with many local minima. The function is f(x, y) = sin(x) * cos(y) + sin(x*y) + (x^2 + y^2)/20. Focus on improving the search_algorithm function to reliably find the global minimum, escaping local minima that might trap simple algorithms. IMPORTANT: Do not rewrite the entire program - focus on targeted improvements wrapped in EVOLVE-BLOCK-START and EVOLVE-BLOCK-START. And you must use <<<<<<< SEARCH and >>>>>> REPLACE diff format to change the code."
  # 2025.9.17: Add Template Dir
  template_dir: "/data/CodeEfficiency/openevolve/openevolve/prompts/enhanced"

# Database configuration
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  log_prompts: true

# Evaluator configuration
evaluator:
  timeout: 60
  enable_artifacts: true      # Error feedback to LLM
  cascade_thresholds: [1.3]
  parallel_evaluations: 3

# Evolution settings
diff_based_evolution: true
max_code_length: 20000