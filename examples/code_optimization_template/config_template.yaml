# Configuration for code minimization example
max_iterations: 50
checkpoint_interval: 5

llm:
  primary_model: "Qwen3-8B"
  primary_model_weight: 1

  api_base: http://127.0.0.1:8080/v1
  api_key: code-efficiency                     
  temperature: 0.7
  max_tokens: 16000
  timeout: 120

# Prompt configuration
prompt:
  # 2025.9.17: Shed light on some requirements
  system_message: |
    "You are an expert programmer specializing in advanced algorithm design and implement, focus on correctness, time efficiency and memory efficiency. 
    
    Please based on the task description write Solution to pass the provided test cases. 
    You must follow the following rules:
    First, the code should be in ```python\n[Code]\n``` block.
    Second, You should not add the provided test cases into your ```\npython[Code]\n``` block.
    Third, You are not need to write the test cases, we will provide the test cases for you.
    Finally, You should make sure that the provided test cases can pass your solution.


    # Task description:
    {task_description}

    IMPORTANT: Do not rewrite the entire program - focus on targeted improvements wrapped in EVOLVE-BLOCK-START and EVOLVE-BLOCK-START. And you must use <<<<<<< SEARCH, ======= and >>>>>> REPLACE diff format to change the code."
  
  # 2025.9.17: Add Template Dir
  template_dir: "/data/CodeEfficiency/openevolve/openevolve/prompts/defaults"

# Database configuration
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  log_prompts: true # Enable logging of prompts for debugging

# Evaluator configuration
evaluator:
  timeout: 300
  enable_artifacts: true      # Error feedback to LLM
  # cascade_thresholds: [1.3]
  parallel_evaluations: 2

# Evolution settings
diff_based_evolution: true
max_code_length: 20000