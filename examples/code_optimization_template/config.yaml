max_iterations: 50
checkpoint_interval: 5
llm:
  primary_model: google/gemini-2.5-flash-lite
  primary_model_weight: 0.8
  secondary_model: google/gemini-2.5-flash
  secondary_model_weight: 0.2
  api_base: https://openrouter.ai/api/v1
  api_key: # Add your OpenRouter API key here
  temperature: 0.7
  max_tokens: 16000
  timeout: 120
prompt:
  system_message: "\"You are an expert programmer specializing in advanced algorithm\
    \ design and implement, focus on correctness, time efficiency and memory efficiency.\
    \ \n\nPlease based on the task description write Solution to pass the provided\
    \ test cases. \nYou must follow the following rules:\nFirst, the code should be\
    \ in ```python\\n[Code]\\n``` block.\nSecond, You should not add the provided\
    \ test cases into your ```\\npython[Code]\\n``` block.\nThird, You are not need\
    \ to write the test cases, we will provide the test cases for you.\nFinally, You\
    \ should make sure that the provided test cases can pass your solution.\n\n\n\
    # Task description:\nGiven an m x n grid of characters board and a string word,\
    \ return true if word exists in the grid.\n\nThe word can be constructed from\
    \ letters of sequentially adjacent cells, where adjacent cells are horizontally\
    \ or vertically neighboring. The same letter cell may not be used more than once.\n\
    \n \nExample 1:\n\nInput: board = [[\"A\",\"B\",\"C\",\"E\"],[\"S\",\"F\",\"C\"\
    ,\"S\"],[\"A\",\"D\",\"E\",\"E\"]], word = \"ABCCED\"\nOutput: true\n\n\nExample\
    \ 2:\n\nInput: board = [[\"A\",\"B\",\"C\",\"E\"],[\"S\",\"F\",\"C\",\"S\"],[\"\
    A\",\"D\",\"E\",\"E\"]], word = \"SEE\"\nOutput: true\n\n\nExample 3:\n\nInput:\
    \ board = [[\"A\",\"B\",\"C\",\"E\"],[\"S\",\"F\",\"C\",\"S\"],[\"A\",\"D\",\"\
    E\",\"E\"]], word = \"ABCB\"\nOutput: false\n\n\n \nConstraints:\n\n\n\tm == board.length\n\
    \tn = board[i].length\n\t1 <= m, n <= 6\n\t1 <= word.length <= 15\n\tboard and\
    \ word consists of only lowercase and uppercase English letters.\n\n\n \nFollow\
    \ up: Could you use search pruning to make your solution faster with a larger\
    \ board?\n\n\n\nIMPORTANT: Do not rewrite the entire program - focus on targeted\
    \ improvements wrapped in EVOLVE-BLOCK-START and EVOLVE-BLOCK-START. And you must\
    \ use <<<<<<< SEARCH and >>>>>> REPLACE diff format to change the code.\"\n"
  template_dir: /data/CodeEfficiency/openevolve/openevolve/prompts/enhanced
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  log_prompts: true
evaluator:
  timeout: 60
  cascade_thresholds:
  - 1.3
  parallel_evaluations: 3
diff_based_evolution: true
max_code_length: 20000
